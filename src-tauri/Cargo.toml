[package]
name = "filemind-desktop"
version = "0.2.0"
description = "FileMind — Native Storage Intelligence & Deterministic Safety Engine for Windows"
authors = ["FileMind Team"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-updater = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
filemind-core = { path = "../crates/filemind-core" }

