[package]
name = "filemind-core"
version = "0.2.0"
edition = "2021"
authors = ["FileMind Team"]
description = "High-performance native storage scanner, SQLite index, and storage intelligence engine"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell"
] }
crossbeam-channel = "0.5"
notify = "6.1"
tiny_http = "0.12"
url = "2.5"
blake3 = "1.5"
lopdf = "0.34"

[dev-dependencies]
tempfile = "3.16"

