name: FileMind Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Verification Suite
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Cache pnpm Store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Rust Stable Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies & Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Type Check
        run: pnpm run typecheck

      - name: Run Frontend Production Build
        run: pnpm run build

      - name: Verify Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy Linter
        run: cargo clippy --manifest-path crates/filemind-core/Cargo.toml --all-targets

      - name: Run Rust Test Suites (Unit, Integration, Security, Benchmarks)
        run: cargo test --manifest-path crates/filemind-core/Cargo.toml --all -- --nocapture

      - name: Verify Portable Release Packaging Pipeline
        run: powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1 -Version "ci-test"

